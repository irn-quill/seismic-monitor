      color:       m.cluster ? '#fff' : 'transparent',
      weight:      m.cluster ? 1 : 0,
      opacity:     0.9,
      fillOpacity: m.cluster ? 0.85 : 0.5
    }).addTo(map).bindPopup(m.popup);
  });
</script>
</body>
</html>
